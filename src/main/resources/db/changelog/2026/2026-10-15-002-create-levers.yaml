# Commercial levers: tier discounts, combos and gifts. Rules are deactivated rather than deleted, because quote
# lines and their discount components keep pointing at the rule that produced them.
databaseChangeLog:
  - logicalFilePath: db/changelog/2026/2026-10-15-002-create-levers.yaml

  # A tier rule targets either one SKU or one family, and each target has at most one active rule (BR-02).
  - changeSet:
      id: create-tier-rules
      author: orderflow-engine
      changes:
        - createTable:
            tableName: tier_rules
            columns:
              - column: {name: tenant_id, type: text, constraints: {primaryKey: true, primaryKeyName: pk_tier_rules}}
              - column: {name: id, type: uuid, constraints: {primaryKey: true, primaryKeyName: pk_tier_rules}}
              - column: {name: product_id, type: uuid}
              - column: {name: family_code, type: text}
              - column: {name: active, type: boolean, constraints: {nullable: false}}
        - addForeignKeyConstraint:
            constraintName: fk_tier_rules_tenant
            baseTableName: tier_rules
            baseColumnNames: tenant_id
            referencedTableName: tenants
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_tier_rules_product
            baseTableName: tier_rules
            baseColumnNames: tenant_id, product_id
            referencedTableName: products
            referencedColumnNames: tenant_id, id
        - addForeignKeyConstraint:
            constraintName: fk_tier_rules_family
            baseTableName: tier_rules
            baseColumnNames: tenant_id, family_code
            referencedTableName: families
            referencedColumnNames: tenant_id, code
        - sql:
            sql: ALTER TABLE tier_rules ADD CONSTRAINT ck_tier_rules_target CHECK (num_nonnulls(product_id, family_code) = 1)
        - sql:
            sql: CREATE UNIQUE INDEX ux_tier_rules_active_product ON tier_rules (tenant_id, product_id) WHERE active
        - sql:
            sql: CREATE UNIQUE INDEX ux_tier_rules_active_family ON tier_rules (tenant_id, family_code) WHERE active
      rollback:
        - dropTable: {tableName: tier_rules}

  # Brackets are marginal: each percent applies only to the units from from_qty up to the next bracket (A-01).
  - changeSet:
      id: create-tier-brackets
      author: orderflow-engine
      changes:
        - createTable:
            tableName: tier_brackets
            columns:
              - column: {name: tenant_id, type: text, constraints: {primaryKey: true, primaryKeyName: pk_tier_brackets}}
              - column: {name: tier_rule_id, type: uuid, constraints: {primaryKey: true, primaryKeyName: pk_tier_brackets}}
              - column: {name: from_qty, type: integer, constraints: {primaryKey: true, primaryKeyName: pk_tier_brackets}}
              - column: {name: percent, type: 'numeric(7,6)', constraints: {nullable: false}}
        - addForeignKeyConstraint:
            constraintName: fk_tier_brackets_tenant
            baseTableName: tier_brackets
            baseColumnNames: tenant_id
            referencedTableName: tenants
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_tier_brackets_rule
            baseTableName: tier_brackets
            baseColumnNames: tenant_id, tier_rule_id
            referencedTableName: tier_rules
            referencedColumnNames: tenant_id, id
        - sql:
            sql: |
              ALTER TABLE tier_brackets
                ADD CONSTRAINT ck_tier_brackets_from_qty CHECK (from_qty >= 1),
                ADD CONSTRAINT ck_tier_brackets_percent CHECK (percent BETWEEN 0 AND 1)
      rollback:
        - dropTable: {tableName: tier_brackets}

  # Combos are evaluated in id order (BR-03). Ids are UUIDv7, so that is the order in which they were created.
  - changeSet:
      id: create-combo-rules
      author: orderflow-engine
      changes:
        - createTable:
            tableName: combo_rules
            columns:
              - column: {name: tenant_id, type: text, constraints: {primaryKey: true, primaryKeyName: pk_combo_rules}}
              - column: {name: id, type: uuid, constraints: {primaryKey: true, primaryKeyName: pk_combo_rules}}
              - column: {name: combo_price, type: 'numeric(19,4)', constraints: {nullable: false}}
              - column: {name: active, type: boolean, constraints: {nullable: false}}
        - addForeignKeyConstraint:
            constraintName: fk_combo_rules_tenant
            baseTableName: combo_rules
            baseColumnNames: tenant_id
            referencedTableName: tenants
            referencedColumnNames: id
      rollback:
        - dropTable: {tableName: combo_rules}

  - changeSet:
      id: create-combo-items
      author: orderflow-engine
      changes:
        - createTable:
            tableName: combo_items
            columns:
              - column: {name: tenant_id, type: text, constraints: {primaryKey: true, primaryKeyName: pk_combo_items}}
              - column: {name: combo_rule_id, type: uuid, constraints: {primaryKey: true, primaryKeyName: pk_combo_items}}
              - column: {name: product_id, type: uuid, constraints: {primaryKey: true, primaryKeyName: pk_combo_items}}
              - column: {name: min_qty, type: integer, constraints: {nullable: false}}
        - addForeignKeyConstraint:
            constraintName: fk_combo_items_tenant
            baseTableName: combo_items
            baseColumnNames: tenant_id
            referencedTableName: tenants
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_combo_items_rule
            baseTableName: combo_items
            baseColumnNames: tenant_id, combo_rule_id
            referencedTableName: combo_rules
            referencedColumnNames: tenant_id, id
        - addForeignKeyConstraint:
            constraintName: fk_combo_items_product
            baseTableName: combo_items
            baseColumnNames: tenant_id, product_id
            referencedTableName: products
            referencedColumnNames: tenant_id, id
        - sql:
            sql: ALTER TABLE combo_items ADD CONSTRAINT ck_combo_items_min_qty CHECK (min_qty >= 1)
      rollback:
        - dropTable: {tableName: combo_items}

  # A gift is triggered by a paid quantity of one SKU or one family, or by a minimum gross subtotal (BR-04).
  - changeSet:
      id: create-gift-rules
      author: orderflow-engine
      changes:
        - createTable:
            tableName: gift_rules
            columns:
              - column: {name: tenant_id, type: text, constraints: {primaryKey: true, primaryKeyName: pk_gift_rules}}
              - column: {name: id, type: uuid, constraints: {primaryKey: true, primaryKeyName: pk_gift_rules}}
              - column: {name: trigger_product_id, type: uuid}
              - column: {name: trigger_family_code, type: text}
              - column: {name: min_qty, type: integer}
              - column: {name: min_gross, type: 'numeric(19,4)'}
              - column: {name: gift_product_id, type: uuid, constraints: {nullable: false}}
              - column: {name: gift_qty, type: integer, constraints: {nullable: false}}
              - column: {name: repeatable, type: boolean, constraints: {nullable: false}}
              - column: {name: active, type: boolean, constraints: {nullable: false}}
        - addForeignKeyConstraint:
            constraintName: fk_gift_rules_tenant
            baseTableName: gift_rules
            baseColumnNames: tenant_id
            referencedTableName: tenants
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_gift_rules_trigger_product
            baseTableName: gift_rules
            baseColumnNames: tenant_id, trigger_product_id
            referencedTableName: products
            referencedColumnNames: tenant_id, id
        - addForeignKeyConstraint:
            constraintName: fk_gift_rules_trigger_family
            baseTableName: gift_rules
            baseColumnNames: tenant_id, trigger_family_code
            referencedTableName: families
            referencedColumnNames: tenant_id, code
        - addForeignKeyConstraint:
            constraintName: fk_gift_rules_gift_product
            baseTableName: gift_rules
            baseColumnNames: tenant_id, gift_product_id
            referencedTableName: products
            referencedColumnNames: tenant_id, id
        # Exactly one trigger: a product or a family, each with min_qty, or min_gross alone.
        - sql:
            sql: |
              ALTER TABLE gift_rules
                ADD CONSTRAINT ck_gift_rules_trigger
                  CHECK (num_nonnulls(trigger_product_id, trigger_family_code, min_gross) = 1
                         AND (min_qty IS NULL) = (min_gross IS NOT NULL)),
                ADD CONSTRAINT ck_gift_rules_gift_qty CHECK (gift_qty >= 1)
      rollback:
        - dropTable: {tableName: gift_rules}
