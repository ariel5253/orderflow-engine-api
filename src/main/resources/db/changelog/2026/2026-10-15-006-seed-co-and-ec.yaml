                ('ec-alpha', '01a13cdb-cc00-7002-8002-000000000002', 'BEV-COLA-1500',   'Cola 1.5 l',          'colas',  0.150000, 1.45),
                ('ec-alpha', '01a13cdb-cc00-7002-8002-000000000003', 'SNK-PLANTAIN-45', 'Plantain chips 45 g', 'snacks', 0.150000, 0.55),
                ('ec-alpha', '01a13cdb-cc00-7002-8002-000000000004', 'BEV-WATER-600',   'Water 600 ml',        'waters', 0.150000, 0.45);

              INSERT INTO tier_rules (tenant_id, id, product_id, family_code, active) VALUES
