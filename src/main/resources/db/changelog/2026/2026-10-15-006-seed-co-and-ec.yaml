                ('ec-alpha', '01a13cdb-cc00-7002-8003-000000000001', 12, 0.040000),
                ('ec-alpha', '01a13cdb-cc00-7002-8003-000000000001', 24, 0.080000);

              INSERT INTO combo_rules (tenant_id, id, combo_price, active) VALUES
