                ('ec-alpha', '01a13cdb-cc00-7002-8001-000000000001', 1500.00, 0)
      rollback:
        - sql:
            sql: |
              DELETE FROM credit_accounts WHERE tenant_id = 'ec-alpha';
              DELETE FROM customers WHERE tenant_id = 'ec-alpha';
              DELETE FROM gift_rules WHERE tenant_id = 'ec-alpha';
              DELETE FROM combo_items WHERE tenant_id = 'ec-alpha';
              DELETE FROM combo_rules WHERE tenant_id = 'ec-alpha';
              DELETE FROM tier_brackets WHERE tenant_id = 'ec-alpha';
              DELETE FROM tier_rules WHERE tenant_id = 'ec-alpha';
              DELETE FROM products WHERE tenant_id = 'ec-alpha';
              DELETE FROM families WHERE tenant_id = 'ec-alpha'
