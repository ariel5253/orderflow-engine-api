# The database connection is read only from the environment, through Spring's relaxed binding of
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD. No default is set here.
# SERVER_PORT overrides the HTTP port, 8080 by default. APP_I18N_DEFAULT_LOCALE overrides app.i18n.default-locale.
spring:
  application:
    name: orderflow-engine-api
  # The schema lives with its only owner, this service, and is applied at startup (DEC-20).
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  # User text lives only in these bundles (SPEC §9). The JVM's own locale is never consulted, so the
  # server's language can never leak into a response.
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false

app:
  i18n:
    # Language of the user text when Accept-Language is missing or names no supported language.
    default-locale: es
  # Outbox relay (plan §2). The APP_OUTBOX_* environment variables override these values.
  outbox:
    # How long the relay waits between two polls for due events.
    poll-interval: 1s
    # How long a claimed event stays leased (locked_until). Past it, another poll may claim and send it again.
    lease: 30s
    # Delivery attempts before an event becomes DEAD.
    max-attempts: 8
    # The wait before a retry is drawn between zero and base doubled per failed attempt, never above max.
    backoff:
      base: 2s
      max: 5m
  # Retention housekeeping (SPEC §12). APP_IDEMPOTENCY_RETENTION and APP_HOUSEKEEPING_RETENTION override these values.
  idempotency:
    # How long a key replays its first response. Past it, a retry of a confirmed quote still receives
    # QUOTE_ALREADY_CONFIRMED with the order number, because the order itself is never purged.
    retention: 24h
  housekeeping:
    # How long expired, unconfirmed quotes and SENT outbox events are kept. DEAD events are never purged.
    retention: 7d

logging:
  pattern:
    # Every log line of a request carries its correlation id, the same one its error body shows.
    correlation: "[%X{correlationId:-}] "
