# Spanish texts of the error catalog (SPEC §8). Keys: error.<CODE>.title and error.<CODE>.detail.
error.VALIDATION_FAILED.title=Solicitud no válida
error.VALIDATION_FAILED.detail=La solicitud tiene un formato o un contenido no válido. Revisa los datos enviados.
error.INVALID_QUANTITY.title=Cantidad no válida
error.INVALID_QUANTITY.detail=Cada cantidad debe ser un número entero mayor que cero.
error.CART_EMPTY.title=Carrito vacío
error.CART_EMPTY.detail=El carrito debe tener al menos un producto.
error.TENANT_NOT_FOUND.title=Tenant desconocido
error.TENANT_NOT_FOUND.detail=No existe un tenant con el identificador enviado.
error.IDEMPOTENCY_KEY_MISSING.title=Falta la clave de idempotencia
error.IDEMPOTENCY_KEY_MISSING.detail=Para confirmar un pedido se requiere el encabezado Idempotency-Key.
error.IDEMPOTENCY_KEY_INVALID.title=Clave de idempotencia no válida
error.IDEMPOTENCY_KEY_INVALID.detail=El encabezado Idempotency-Key debe tener entre 8 y 64 letras, dígitos, guiones o guiones bajos.
error.QUOTE_NOT_FOUND.title=Cotización no encontrada
error.QUOTE_NOT_FOUND.detail=La cotización no existe o no pertenece a este cliente.
error.ORDER_NOT_FOUND.title=Pedido no encontrado
error.ORDER_NOT_FOUND.detail=El pedido no existe o no pertenece a este cliente.
error.CUSTOMER_NOT_FOUND.title=Cliente no encontrado
error.CUSTOMER_NOT_FOUND.detail=El cliente no existe para este tenant.
error.REQUEST_NOT_SUPPORTED.title=Solicitud no admitida
error.REQUEST_NOT_SUPPORTED.detail=La dirección, el método o el formato de la solicitud no son admitidos. Revisa la documentación de la API.
error.QUOTE_EXPIRED.title=Cotización vencida
error.QUOTE_EXPIRED.detail=La cotización ya venció. Solicita una nueva cotización.
error.QUOTE_ALREADY_CONFIRMED.title=Cotización ya confirmada
error.QUOTE_ALREADY_CONFIRMED.detail=La cotización ya fue confirmada en otro pedido.
error.CREDIT_LIMIT_EXCEEDED.title=Cupo de crédito insuficiente
error.CREDIT_LIMIT_EXCEEDED.detail=El total del pedido supera el cupo disponible.
error.IDEMPOTENCY_KEY_IN_PROGRESS.title=Solicitud en proceso
error.IDEMPOTENCY_KEY_IN_PROGRESS.detail=Otra solicitud del mismo pedido o cliente aún se está procesando. Intenta de nuevo en unos segundos.
error.UNKNOWN_SKU.title=Producto desconocido
error.UNKNOWN_SKU.detail=Uno de los productos no existe o no se vende en este tenant.
error.CREDIT_NOT_ENABLED.title=Crédito no habilitado
error.CREDIT_NOT_ENABLED.detail=El cliente no tiene una cuenta de crédito. Elige otro medio de pago.
error.IDEMPOTENCY_KEY_REUSED.title=Clave de idempotencia reutilizada
error.IDEMPOTENCY_KEY_REUSED.detail=La clave de idempotencia ya se usó con otra solicitud. Usa una clave nueva.
error.INTERNAL_ERROR.title=Error interno
error.INTERNAL_ERROR.detail=Ocurrió un error inesperado. Intenta de nuevo más tarde.
