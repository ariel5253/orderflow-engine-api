# English texts of the error catalog (SPEC §8). Keys: error.<CODE>.title and error.<CODE>.detail.
error.VALIDATION_FAILED.title=Invalid request
error.VALIDATION_FAILED.detail=The request has an invalid format or content. Check the data you sent.
error.INVALID_QUANTITY.title=Invalid quantity
error.INVALID_QUANTITY.detail=Each quantity must be a whole number greater than zero.
error.CART_EMPTY.title=Empty cart
error.CART_EMPTY.detail=The cart must contain at least one product.
error.TENANT_NOT_FOUND.title=Unknown tenant
error.TENANT_NOT_FOUND.detail=No tenant exists with the given identifier.
error.IDEMPOTENCY_KEY_MISSING.title=Missing idempotency key
error.IDEMPOTENCY_KEY_MISSING.detail=Confirming an order requires the Idempotency-Key header.
error.IDEMPOTENCY_KEY_INVALID.title=Invalid idempotency key
error.IDEMPOTENCY_KEY_INVALID.detail=The Idempotency-Key header must have 8 to 64 letters, digits, hyphens or underscores.
error.QUOTE_NOT_FOUND.title=Quote not found
error.QUOTE_NOT_FOUND.detail=The quote does not exist or does not belong to this customer.
error.ORDER_NOT_FOUND.title=Order not found
error.ORDER_NOT_FOUND.detail=The order does not exist or does not belong to this customer.
error.CUSTOMER_NOT_FOUND.title=Customer not found
error.CUSTOMER_NOT_FOUND.detail=The customer does not exist for this tenant.
error.REQUEST_NOT_SUPPORTED.title=Request not supported
error.REQUEST_NOT_SUPPORTED.detail=The address, method or format of the request is not supported. Check the API documentation.
error.QUOTE_EXPIRED.title=Quote expired
error.QUOTE_EXPIRED.detail=The quote has expired. Request a new quote.
error.QUOTE_ALREADY_CONFIRMED.title=Quote already confirmed
error.QUOTE_ALREADY_CONFIRMED.detail=The quote was already confirmed in another order.
error.CREDIT_LIMIT_EXCEEDED.title=Credit limit exceeded
error.CREDIT_LIMIT_EXCEEDED.detail=The order total exceeds the available credit.
error.IDEMPOTENCY_KEY_IN_PROGRESS.title=Request in progress
error.IDEMPOTENCY_KEY_IN_PROGRESS.detail=A request with the same idempotency key is still being processed. Try again in a few seconds.
error.UNKNOWN_SKU.title=Unknown product
error.UNKNOWN_SKU.detail=One of the products does not exist or is not sold by this tenant.
error.CREDIT_NOT_ENABLED.title=Credit not enabled
error.CREDIT_NOT_ENABLED.detail=The customer has no credit account. Choose another payment method.
error.IDEMPOTENCY_KEY_REUSED.title=Idempotency key reused
error.IDEMPOTENCY_KEY_REUSED.detail=The idempotency key was already used with a different request. Use a new key.
error.INTERNAL_ERROR.title=Internal error
error.INTERNAL_ERROR.detail=An unexpected error occurred. Try again later.
